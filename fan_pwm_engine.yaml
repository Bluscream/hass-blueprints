blueprint:
  name: Template Fan PWM Engine
  description: "Runs an infinite loop to turn a switch on and off based on an input_number percentage. 1% = X minutes ON. Must be used alongside a Template Fan."
  domain: script
  input:
    target_switch:
      name: Target Switch
      description: "The switch that will be pulsed (e.g. your group entity)."
      selector:
        entity:
          domain:
            - switch
            - fan
    speed_entity:
      name: Speed Percentage Entity
      description: "The input_number helper tracking the fan speed (0 to 100)."
      selector:
        entity:
          domain: input_number
    cycle_time_minutes:
      name: Cycle Time (Minutes)
      description: "The total duration of one full PWM cycle in minutes (e.g., 60 means the on + off time totals 60 minutes)."
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box

mode: restart

sequence:
  - variables:
      speed_entity: !input speed_entity
      switch_entity: !input target_switch
      cycle_minutes: !input cycle_time_minutes
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}" # Infinite loop until script is explicitly turned off
      sequence:
        - variables:
            speed: "{{ states(speed_entity) | float(0) }}"
            cycle_seconds: "{{ cycle_minutes | float * 60 }}"
            on_time_sec: "{{ (speed / 100.0) * cycle_seconds }}"
            off_time_sec: "{{ ((100.0 - speed) / 100.0) * cycle_seconds }}"
            
        - choose:
            # 0%: Turn off and wait
            - conditions:
                - condition: template
                  value_template: "{{ speed == 0 }}"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: "{{ switch_entity }}"
                - delay: "00:05:00" # Sleep for 5 mins before checking loop again
                
            # 100%: Turn on and wait
            - conditions:
                - condition: template
                  value_template: "{{ speed == 100 }}"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ switch_entity }}"
                - delay: "00:05:00"
                
          # Normal PWM Pulse
          default:
            - action: switch.turn_on
              target:
                entity_id: "{{ switch_entity }}"
            - delay:
                seconds: "{{ on_time_sec }}"
            - action: switch.turn_off
              target:
                entity_id: "{{ switch_entity }}"
            - delay:
                seconds: "{{ off_time_sec }}"
