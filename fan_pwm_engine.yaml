blueprint:
  name: Template Fan PWM Engine
  description: >-
    Runs an infinite loop to turn a switch on and off based on an input_number percentage.

    Setup Instructions:
    1. Create a Number Helper (input_number) in Home Assistant via Settings -> Devices & Services -> Helpers. Set the minimum to 0 and maximum to 100 to track the fan speed percentage.
    2. Create a script from this blueprint, selecting your target switch, the Number Helper from Step 1, and your desired cycle time.
    3. (Optional) Create a Template Fan in your configuration.yaml that links to the Number Helper to act as the virtual fan entity in your dashboard.
  domain: script
  input:
    target_switch:
      name: Target Switch
      description: "The switch that will be pulsed (e.g. your group entity)."
      selector:
        entity:
          domain:
            - switch
            - fan
            - climate
    speed_entity:
      name: Speed Percentage Entity
      description: "The input_number helper tracking the fan speed (0 to 100)."
      selector:
        entity:
          domain: input_number
    cycle_time_minutes:
      name: Cycle Time (Minutes)
      description: "The total duration of one full PWM cycle in minutes (e.g., 60 means the on + off time totals 60 minutes)."
      default: 10
      selector:
        number:
          min: 0.5
          max: 60
          step: 0.5
          mode: box
    min_on_time_minutes:
      name: Minimum On Time (Minutes)
      description: "Ensure the switch stays on for at least this many minutes during a cycle (0 to disable)."
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          mode: box

mode: restart

sequence:
  - variables:
      speed_entity: !input speed_entity
      switch_entity: !input target_switch
      cycle_minutes: !input cycle_time_minutes
      min_on_minutes: !input min_on_time_minutes
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}" # Infinite loop until script is explicitly turned off
      sequence:
        - variables:
            speed: "{{ states(speed_entity) | float(0) }}"
            cycle_seconds: "{{ cycle_minutes | float * 60 }}"
            min_on_seconds: "{{ min_on_minutes | float * 60 }}"
            raw_on_time_sec: "{{ (speed / 100.0) * cycle_seconds }}"
            capped_on_time_sec: "{{ [raw_on_time_sec, min_on_seconds] | max }}"
            on_time_sec: "{{ [capped_on_time_sec, cycle_seconds] | min }}"
            off_time_sec: "{{ cycle_seconds - on_time_sec }}"
            
        - choose:
            # 0%: Turn off and wait
            - conditions:
                - condition: template
                  value_template: "{{ speed == 0 }}"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: "{{ switch_entity }}"
                - delay: "00:05:00" # Sleep for 5 mins before checking loop again
                
            # 100%: Turn on and wait
            - conditions:
                - condition: template
                  value_template: "{{ speed == 100 }}"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ switch_entity }}"
                - delay: "00:05:00"
                
          # Normal PWM Pulse
          default:
            - action: switch.turn_on
              target:
                entity_id: "{{ switch_entity }}"
            - delay:
                seconds: "{{ on_time_sec }}"
            - action: switch.turn_off
              target:
                entity_id: "{{ switch_entity }}"
            - delay:
                seconds: "{{ off_time_sec }}"
